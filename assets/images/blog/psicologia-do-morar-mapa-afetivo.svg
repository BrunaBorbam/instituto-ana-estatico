<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d">
<title id="t">Mapa afetivo do morar</title><desc id="d">Infográfico editorial sobre memória, rotina, identidade, conforto e pertencimento em torno do conceito de lar.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f7f1e8"/><stop offset="1" stop-color="#fffaf4"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="9" stdDeviation="15" flood-color="#071b33" flood-opacity=".1"/></filter></defs>
<rect width="1200" height="620" rx="30" fill="url(#bg)"/>
<text x="62" y="75" font-family="Arial,sans-serif" font-weight="700" font-size="18" letter-spacing="3" fill="#b65c2a">DESIGN HUMANIZADO</text>
<text x="62" y="122" font-family="Georgia,serif" font-weight="bold" font-size="44" fill="#071b33">O que transforma uma casa em lar?</text>
<path d="M600 200V480 M290 341H910" stroke="#d8c5b3" stroke-width="3" stroke-dasharray="8 12"/>
<circle cx="600" cy="341" r="112" fill="#071b33" filter="url(#shadow)"/><text x="600" y="331" text-anchor="middle" fill="#ffffff" font-size="37" font-family="Georgia,serif" font-weight="bold">LAR</text><text x="600" y="364" text-anchor="middle" fill="#ffbf92" font-size="16" font-family="Arial,sans-serif">IDENTIDADE + VIDA</text>
<g font-family="Arial,sans-serif" text-anchor="middle" font-size="22" font-weight="bold">
<rect x="84" y="222" width="318" height="106" rx="22" fill="#fff" filter="url(#shadow)"/><circle cx="115" cy="275" r="12" fill="#f07b37"/><text x="249" y="268" fill="#071b33">Memórias</text><text x="249" y="296" font-size="14" font-weight="400" fill="#536274">objetos e histórias</text>
<rect x="798" y="222" width="318" height="106" rx="22" fill="#fff" filter="url(#shadow)"/><circle cx="831" cy="275" r="12" fill="#f07b37"/><text x="958" y="268" fill="#071b33">Rotinas</text><text x="958" y="296" font-size="14" font-weight="400" fill="#536274">uso real dos espaços</text>
<rect x="84" y="363" width="318" height="106" rx="22" fill="#fff" filter="url(#shadow)"/><circle cx="115" cy="417" r="12" fill="#f07b37"/><text x="249" y="410" fill="#071b33">Conforto</text><text x="249" y="438" font-size="14" font-weight="400" fill="#536274">luz, toque e descanso</text>
<rect x="798" y="363" width="318" height="106" rx="22" fill="#fff" filter="url(#shadow)"/><circle cx="831" cy="417" r="12" fill="#f07b37"/><text x="958" y="410" fill="#071b33">Pertencimento</text><text x="958" y="438" font-size="14" font-weight="400" fill="#536274">valores e singularidades</text></g>
<text x="600" y="552" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#536274">O projeto começa quando escutamos quem vai viver naquele espaço.</text>
