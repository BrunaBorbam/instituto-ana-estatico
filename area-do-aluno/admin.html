<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow"><title>Painel Instituto Ana</title>
  <style>:root{--navy:#071b33;--orange:#ff6500;--line:#dbe4ee}*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:var(--navy);font:15px Arial,sans-serif}.top{background:var(--navy);color:#fff;padding:18px 5%;display:flex;justify-content:space-between;align-items:center}.top strong{font-size:20px}.top button{background:transparent;color:#fff;border:1px solid #ffffff66;border-radius:8px;padding:9px 13px;cursor:pointer}.wrap{max-width:1100px;margin:30px auto;padding:0 20px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;margin-bottom:22px;box-shadow:0 8px 28px #071b3310}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:block;font-weight:700;margin:12px 0 6px}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:8px;padding:11px;font:inherit}textarea{min-height:150px;resize:vertical}.btn{background:var(--orange);border:0;color:#fff;border-radius:8px;padding:12px 18px;font-weight:700;cursor:pointer;margin-top:16px}.muted{color:#607086}.post{border-top:1px solid var(--line);padding:15px 0;display:flex;justify-content:space-between;gap:12px}.post:first-child{border-top:0}.post button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px;cursor:pointer}.status{min-height:22px;color:#53657a}.hidden{display:none}@media(max-width:700px){.grid{grid-template-columns:1fr}.top{gap:12px}.top strong{font-size:16px}}</style>
</head>
<body>
  <header class="top"><strong>Painel Instituto Ana</strong><button id="logout">Sair</button></header>
  <main class="wrap">
    <section id="auth" class="card"><h1>Entrar no painel</h1><p class="muted">Somente administradores autorizados podem publicar conteúdo.</p><form id="login"><label>E-mail</label><input id="email" type="email" required><label>Senha</label><input id="password" type="password" required><button class="btn">Entrar</button></form><p id="auth-status" class="status"></p></section>
    <section id="app" class="hidden">
      <div class="card"><h1>Novo post</h1><p class="muted">Salve como rascunho ou publique no blog.</p><form id="post-form"><input id="post-id" type="hidden"><div class="grid"><div><label>Título</label><input id="title" required></div><div><label>Slug</label><input id="slug" placeholder="ex: design-biofilico" required></div></div><label>Resumo</label><textarea id="excerpt" rows="3"></textarea><label>Conteúdo</label><textarea id="content" required></textarea><div class="grid"><div><label>Imagem de capa (URL)</label><input id="cover"></div><div><label>Status</label><select id="status"><option value="draft">Rascunho</option><option value="published">Publicado</option></select></div></div><button class="btn">Salvar post</button><button type="button" class="btn" id="clear" style="background:#607086;margin-left:8px">Limpar</button></form><p id="post-status" class="status"></p></div>
      <div class="card"><h2>Posts salvos</h2><div id="posts" class="muted">Carregando…</div></div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
  <script>
  const db=supabase.createClient('https://llbisfkatpgkothsetso.supabase.co','sb_publishable_bIwx5UgckFzhmmizdO-HaA_0wqoiol3');
  const $=id=>document.getElementById(id), msg=(id,t)=>$(id).textContent=t;
  async function load(){const {data:{session}}=await db.auth.getSession();if(!session){$('auth').classList.remove('hidden');$('app').classList.add('hidden');return}const check=await db.rpc('is_site_admin');if(check.error||check.data!==true){$('auth').classList.remove('hidden');msg('auth-status','Acesso restrito ao administrador.');return}$('auth').classList.add('hidden');$('app').classList.remove('hidden');const {data,error}=await db.from('blog_posts').select('*').order('created_at',{ascending:false});if(error){msg('posts','Não foi possível carregar os posts.');return}$('posts').innerHTML=data.length?data.map(p=>`<div class="post"><div><strong>${escapeHtml(p.title)}</strong><br><small>${p.status==='published'?'Publicado':'Rascunho'} · ${new Date(p.created_at).toLocaleDateString('pt-BR')}</small></div><button data-edit="${p.id}">Editar</button></div>`).join(''):'Nenhum post cadastrado ainda.';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(data.find(p=>p.id===b.dataset.edit)))}
  function escapeHtml(s){return String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
  function edit(p){$('post-id').value=p.id;$('title').value=p.title;$('slug').value=p.slug;$('excerpt').value=p.excerpt||'';$('content').value=p.content||'';$('cover').value=p.cover_url||'';$('status').value=p.status;scrollTo({top:0,behavior:'smooth'})}
  $('login').onsubmit=async e=>{e.preventDefault();msg('auth-status','Entrando…');const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});msg('auth-status',error?(error.code==='email_not_confirmed'?'Confirme o e-mail da conta antes de entrar. Use a confirmação enviada pelo Supabase.':error.code==='invalid_credentials'?'E-mail ou senha inválidos. Use “Esqueci minha senha” na tela de acesso do aluno.':'Não foi possível entrar agora. Tente novamente.'):'');if(!error)load()};
  $('post-form').onsubmit=async e=>{e.preventDefault();const {data:{user}}=await db.auth.getUser();const row={title:$('title').value.trim(),slug:$('slug').value.trim().toLowerCase().replace(/[^a-z0-9-]/g,'-'),excerpt:$('excerpt').value.trim(),content:$('content').value,cover_url:$('cover').value.trim()||null,status:$('status').value,author_id:user.id,published_at:$('status').value==='published'?new Date().toISOString():null,updated_at:new Date().toISOString()};const id=$('post-id').value;const result=id?await db.from('blog_posts').update(row).eq('id',id):await db.from('blog_posts').insert(row);msg('post-status',result.error?'Não foi possível salvar. Verifique se seu usuário foi autorizado.':'Post salvo com sucesso.');if(!result.error){$('post-form').reset();$('post-id').value='';load()}};
  $('clear').onclick=()=>$('post-form').reset();$('logout').onclick=async()=>{await db.auth.signOut();load()};load();
  </script>
</body></html>
