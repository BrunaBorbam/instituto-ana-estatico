<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Painel Instituto Ana</title><style>body{font:15px Arial;background:#f4f7fb;color:#071b33;margin:0}.top{background:#071b33;color:white;padding:20px 5%;display:flex;justify-content:space-between}.wrap{max-width:1000px;margin:30px auto;padding:0 20px}.card{background:white;border-radius:16px;padding:24px;margin-bottom:20px;box-shadow:0 8px 28px #071b3315}label{display:block;font-weight:bold;margin:12px 0 6px}input,textarea,select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #dbe4ee;border-radius:8px;font:inherit}textarea{min-height:140px}.btn{background:#ff6500;color:#fff;border:0;border-radius:8px;padding:12px 18px;font-weight:bold;margin-top:16px;cursor:pointer}.status{min-height:22px;color:#53657a}.hidden{display:none}.post{border-top:1px solid #dbe4ee;padding:14px 0}@media(min-width:700px){.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}}</style></head><body><header class="top"><strong>Painel Instituto Ana</strong><button id="logout">Sair</button></header><main class="wrap"><section id="auth" class="card"><h1>Entrar no painel</h1><form id="login"><label>E-mail</label><input id="email" type="email" required><label>Senha</label><input id="password" type="password" required><button class="btn">Entrar</button></form><p id="auth-status" class="status"></p></section><section id="app" class="hidden"><div class="card"><h1>Novo post</h1><form id="post-form"><input id="post-id" type="hidden"><div class="grid"><div><label>Título</label><input id="title" required></div><div><label>Slug</label><input id="slug" required></div></div><label>Resumo</label><textarea id="excerpt"></textarea><label>Conteúdo</label><textarea id="content" required></textarea><label>Imagem de capa (URL)</label><input id="cover"><label>Status</label><select id="status"><option value="draft">Rascunho</option><option value="published">Publicado</option></select><button class="btn">Salvar post</button></form><p id="post-status" class="status"></p></div><div class="card"><h2>Posts salvos</h2><div id="posts">Carregando…</div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script><script>const db=supabase.createClient('https://llbisfkatpgkothsetso.supabase.co','sb_publishable_bIwx5UgckFzhmmizdO-HaA_0wqoiol3');const $=id=>document.getElementById(id),msg=(id,t)=>$(id).textContent=t;async function load(){const{data:{session}}=await db.auth.getSession();if(!session){$('auth').classList.remove('hidden');$('app').classList.add('hidden');return}const check=await db.rpc('is_site_admin');if(check.error||check.data!==true){msg('auth-status','Acesso restrito ao administrador.');return}$('auth').classList.add('hidden');$('app').classList.remove('hidden');const{data,error}=await db.from('blog_posts').select('*').order('created_at',{ascending:false});if(error){msg('posts','Não foi possível carregar.');return}$('posts').innerHTML=data.length?data.map(p=>'<div class="post"><strong>'+String(p.title).replace(/[<>]/g,'')+'</strong><br><small>'+p.status+'</small></div>').join(''):'Nenhum post cadastrado.'}$('login').onsubmit=async e=>{e.preventDefault();msg('auth-status','Entrando…');const{error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)msg('auth-status','E-mail ou senha inválidos.');else load()};$('post-form').onsubmit=async e=>{e.preventDefault();const{data:{user}}=await db.auth.getUser();const row={title:$('title').value.trim(),slug:$('slug').value.trim().toLowerCase().replace(/[^a-z0-9-]/g,'-'),excerpt:$('excerpt').value.trim(),content:$('content').value,cover_url:$('cover').value.trim()||null,status:$('status').value,author_id:user.id,published_at:$('status').value==='published'?new Date().toISOString():null};const{error}=await db.from('blog_posts').insert(row);msg('post-status',error?'Não foi possível salvar. Autorize seu usuário administrador primeiro.':'Post salvo com sucesso.');if(!error)load()};$('logout').onclick=async()=>{await db.auth.signOut();load()};load();</script></body></html>
