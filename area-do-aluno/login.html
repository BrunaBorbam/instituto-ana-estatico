<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Entrar na plataforma | Instituto Ana</title><link rel="canonical" href="https://www.anainstitutodeeducacao.com.br/area-do-aluno/login.html"><link rel="stylesheet" href="/assets/css/instituto-ana-design.css"><style>:root{--navy:#071b33;--orange:#ff6500;--blue:#1686ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f4f7fb;color:var(--navy);font-family:Arial,sans-serif;display:grid;place-items:center;padding:24px}.login-shell{width:min(100%,460px);background:#fff;border-radius:24px;padding:36px;box-shadow:0 18px 55px rgba(7,27,51,.14)}.brand{display:flex;align-items:center;gap:12px;margin-bottom:26px}.brand img{width:56px;height:56px;object-fit:contain}.brand strong{font-size:20px}.eyebrow{color:var(--orange);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.login-shell h1{font-size:32px;line-height:1.1;margin:8px 0 10px}.intro{color:#617087;line-height:1.55;margin:0 0 24px}label{display:block;font-weight:700;font-size:14px;margin:16px 0 7px}input{width:100%;border:1px solid #d7e0eb;border-radius:10px;padding:13px 14px;font:inherit}button{width:100%;border:0;border-radius:10px;background:var(--orange);color:#fff;padding:14px;font:700 16px inherit;cursor:pointer;margin-top:22px}.links{display:flex;justify-content:space-between;gap:12px;margin-top:16px}.links button{background:none;color:var(--navy);padding:4px;margin:0;font-size:13px}.status{min-height:24px;margin:18px 0 0;color:#53657a;font-size:14px;line-height:1.45}.back{display:block;text-align:center;color:#53657a;font-size:14px;margin-top:24px;text-decoration:none}.legal{font-size:12px;color:#718096;text-align:center;line-height:1.45;margin-top:22px}@media(max-width:520px){.login-shell{padding:26px 20px;border-radius:18px}.login-shell h1{font-size:28px}}</style></head>
<body><main class="login-shell" aria-labelledby="title"><div class="brand"><img src="/assets/img/Ana-3.png" alt="Instituto Ana"><strong>Instituto Ana</strong></div><div class="eyebrow">Área do aluno</div><h1 id="title">Acesse seus cursos</h1><p class="intro">Entre com seu e-mail e senha. Quando você estiver matriculada em um curso, seus materiais e progresso aparecerão aqui.</p><form id="auth-form"><label for="email">E-mail</label><input id="email" type="email" autocomplete="email" required><label for="password">Senha</label><input id="password" type="password" autocomplete="current-password" minlength="6" required><button id="submit" type="submit">Entrar</button></form><div class="links"><button id="signup" type="button">Criar acesso</button><button id="reset" type="button">Esqueci minha senha</button></div><p id="status" class="status" role="status" aria-live="polite"></p><a class="back" href="/area-do-aluno/">← Voltar para Área do Aluno</a><p class="legal">O acesso é individual. Não compartilhe sua senha.</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script><script>const client=supabase.createClient('https://llbisfkatpgkothsetso.supabase.co','sb_publishable_bIwx5UgckFzhmmizdO-HaA_0wqoiol3');const f=document.querySelector('#auth-form'),s=document.querySelector('#status'),e=document.querySelector('#email'),p=document.querySelector('#password'),b=document.querySelector('#submit');const msg=t=>s.textContent=t;f.addEventListener('submit',async x=>{x.preventDefault();b.disabled=true;msg('Verificando seus dados…');const{error}=await client.auth.signInWithPassword({email:e.value.trim(),password:p.value});msg(error?'Não foi possível entrar. Confira o e-mail e a senha.':'Acesso confirmado. Os cursos aparecerão conforme sua matrícula.');b.disabled=false});document.querySelector('#signup').onclick=async()=>{if(!e.value.trim()||p.value.length<6)return msg('Informe e-mail e senha com pelo menos 6 caracteres.');const{error}=await client.auth.signUp({email:e.value.trim(),password:p.value});msg(error?'Não foi possível criar o acesso.':'Acesso criado. Verifique seu e-mail para confirmar a conta.')};document.querySelector('#reset').onclick=async()=>{if(!e.value.trim())return msg('Informe seu e-mail para recuperar a senha.');const{error}=await client.auth.resetPasswordForEmail(e.value.trim(),{redirectTo:location.origin+'/area-do-aluno/login.html'});msg(error?'Não foi possível enviar o link.':'Link de recuperação enviado para seu e-mail.')};</script></body></html>
