<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Conteúdos dos cursos | Instituto Ana</title><style>:root{--navy:#071b33;--orange:#ff6500;--line:#dbe4ee}*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:var(--navy);font:15px Arial,sans-serif}.top{background:var(--navy);color:#fff;padding:18px 5%;display:flex;justify-content:space-between;align-items:center}.top button{background:none;color:#fff;border:1px solid #ffffff55;border-radius:8px;padding:9px 13px}.wrap{max-width:1100px;margin:30px auto;padding:0 20px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;margin-bottom:20px}label{display:block;font-weight:700;margin:12px 0 6px}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:8px;padding:11px;font:inherit}textarea{min-height:100px}.btn{background:var(--orange);border:0;color:#fff;border-radius:8px;padding:12px 18px;font-weight:700;cursor:pointer;margin-top:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.status{min-height:22px;color:#607086}.hidden{display:none}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><header class="top"><strong>Painel de conteúdos</strong><button id="logout">Sair</button></header><main class="wrap"><section id="login" class="card"><h1>Entrar</h1><p>Somente administradores autorizados podem publicar conteúdos.</p><form><label>E-mail</label><input id="email" type="email" required><label>Senha</label><input id="password" type="password" required><button class="btn">Entrar</button></form><p id="authStatus" class="status"></p></section><section id="app" class="hidden"><div class="card"><h1>Novo curso</h1><form id="courseForm"><label>Nome do curso</label><input id="title" required><label>Descrição</label><textarea id="description"></textarea><label>Imagem de capa (URL)</label><input id="cover"><label><input id="published" type="checkbox" style="width:auto"> Liberar para alunos</label><button class="btn">Salvar curso</button></form><p id="saveStatus" class="status"></p></div><div class="card"><h2>Cursos cadastrados</h2><div id="list">Carregando…</div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script><script>const db=supabase.createClient('https://llbisfkatpgkothsetso.supabase.co','sb_publishable_bIwx5UgckFzhmmizdO-HaA_0wqoiol3');const $=s=>document.querySelector(s);const esc=s=>String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));async function load(){const {data:{session}}=await db.auth.getSession();if(!session)return;const check=await db.rpc('is_site_admin');if(check.error||check.data!==true){$('#authStatus').textContent='Este usuário ainda não foi autorizado como administrador.';return}$('#login').classList.add('hidden');$('#app').classList.remove('hidden');const {data}=await db.from('courses').select('*').order('created_at',{ascending:false});$('#list').innerHTML=(data||[]).map(c=>'<p><strong>'+esc(c.title)+'</strong> · '+(c.published?'Liberado':'Rascunho')+'</p>').join('')||'Nenhum curso cadastrado.'}$('form').onsubmit=async e=>{e.preventDefault();const {error}=await db.auth.signInWithPassword({email:$('#email').value,password:$('#password').value});if(error){$('#authStatus').textContent='Não foi possível entrar.';return}load()};$('#courseForm').onsubmit=async e=>{e.preventDefault();const r=await db.from('courses').insert({title:$('#title').value.trim(),slug:$('#title').value.trim().toLowerCase().replace(/[^a-z0-9]+/g,'-'),description:$('#description').value.trim(),cover_url:$('#cover').value.trim()||null,published:$('#published').checked});$('#saveStatus').textContent=r.error?'Não foi possível salvar.':'Curso salvo com sucesso.';if(!r.error){$('#courseForm').reset();load()}};$('#logout').onclick=async()=>{await db.auth.signOut();location.reload()};load();</script></body></html>
