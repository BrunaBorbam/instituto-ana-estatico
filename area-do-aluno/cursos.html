<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Meus cursos | Instituto Ana</title><link rel="stylesheet" href="/assets/css/instituto-ana-design.css"><style>:root{--navy:#071b33;--orange:#ff6500;--line:#dbe4ee}*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:var(--navy);font:16px Arial,sans-serif}.top{background:var(--navy);color:#fff;padding:18px 5%;display:flex;justify-content:space-between;align-items:center}.top a,.top button{color:#fff;background:none;border:1px solid #ffffff55;border-radius:8px;padding:9px 13px;text-decoration:none;cursor:pointer}.wrap{max-width:1100px;margin:34px auto;padding:0 20px}.intro{margin-bottom:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 8px 28px #071b3310}.card h2{margin-top:0}.module{border-top:1px solid var(--line);padding:14px 0}.lesson{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0}.lesson a{color:var(--orange);font-weight:700}.empty{padding:32px;text-align:center;background:#fff;border-radius:16px;color:#607086}.status{color:#607086;min-height:24px}</style></head><body><header class="top"><strong>Instituto Ana · Meus cursos</strong><div><a href="/">Site</a> <button id="logout">Sair</button></div></header><main class="wrap"><div class="intro"><h1>Olá, estudante!</h1><p>Este é o seu espaço para acompanhar aulas, vídeos e materiais do Instituto Ana.</p><p id="status" class="status">Carregando seus cursos…</p></div><section id="courses" class="grid"></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script><script>
const db=supabase.createClient('https://llbisfkatpgkothsetso.supabase.co','sb_publishable_bIwx5UgckFzhmmizdO-HaA_0wqoiol3');const $=s=>document.querySelector(s);const esc=s=>String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));async function load(){const {data:{session}}=await db.auth.getSession();if(!session){location.href='/area-do-aluno/login.html';return}const {data,error}=await db.from('courses').select('id,title,description,cover_url,course_modules(id,title,position,course_lessons(id,title,position,video_url,published))').order('created_at',{ascending:false});if(error){$('#status').textContent='A área de conteúdos ainda está sendo configurada. Em breve seus cursos aparecerão aqui.';return}const rows=(data||[]);$('#status').textContent=rows.length?'Selecione uma aula para começar.':'Nenhum curso foi liberado para sua matrícula ainda.';$('#courses').innerHTML=rows.map(c=>'<article class="card">'+(c.cover_url?'<img src="'+esc(c.cover_url)+'" alt="" style="width:100%;height:150px;object-fit:cover;border-radius:10px">':'')+'<h2>'+esc(c.title)+'</h2><p>'+esc(c.description)+'</p>'+((c.course_modules||[]).sort((a,b)=>a.position-b.position).map(m=>'<div class="module"><strong>'+esc(m.title)+'</strong>'+((m.course_lessons||[]).filter(l=>l.published).sort((a,b)=>a.position-b.position).map(l=>'<div class="lesson"><span>'+esc(l.title)+'</span>'+(l.video_url?'<a href="'+esc(l.video_url)+'" target="_blank" rel="noopener">Assistir</a>':'')+'</div>').join('')+'</div>').join('')||'<p>Conteúdos em preparação.</p>')+'</article>').join('')}$('#logout').onclick=async()=>{await db.auth.signOut();location.href='/area-do-aluno/login.html'};load();
</script></body></html>
