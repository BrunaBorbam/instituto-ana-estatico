<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Meus cursos | Instituto Ana</title>
<link rel="stylesheet" href="/assets/css/instituto-ana-design.css">
<style>
:root{--navy:#071b33;--orange:#ff6500;--line:#dbe4ee}*{box-sizing:border-box}
body{margin:0;background:#f4f7fb;color:var(--navy);font:16px Arial,sans-serif}
.top{background:var(--navy);color:#fff;padding:18px 5%;display:flex;justify-content:space-between;align-items:center}
.top a,.top button{color:#fff;background:none;border:1px solid #ffffff55;border-radius:8px;padding:9px 13px;text-decoration:none;cursor:pointer}
.wrap{max-width:1100px;margin:34px auto;padding:0 20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 8px 28px #071b3310}
.card h2{margin-top:0}.module{border-top:1px solid var(--line);padding:14px 0}
.lesson{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0}
.lesson a{color:var(--orange);font-weight:700}.status{color:#607086;min-height:24px}
</style>
</head>
<body>
<header class="top"><strong>Instituto Ana · Meus cursos</strong><div><a href="/">Site</a> <button id="logout">Sair</button></div></header>
<main class="wrap"><h1>Olá, estudante!</h1><p>Este é o seu espaço para acompanhar aulas, vídeos e materiais do Instituto Ana.</p><p id="status" class="status">Carregando seus cursos…</p><section id="courses" class="grid"></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<script>
const db=supabase.createClient('https://llbisfkatpgkothsetso.supabase.co','sb_publishable_bIwx5UgckFzhmmizdO-HaA_0wqoiol3');
const status=document.getElementById('status');
const courses=document.getElementById('courses');
const esc=(value)=>String(value||'').replace(/[&<>'"]/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function renderCourse(course){
  const modules=(course.course_modules||[]).sort((a,b)=>a.position-b.position);
  const moduleHtml=modules.map((module)=>{
    const lessons=(module.course_lessons||[]).filter((lesson)=>lesson.published).sort((a,b)=>a.position-b.position);
    const lessonsHtml=lessons.map((lesson)=>{
      const link=lesson.video_url ? '<a href="'+esc(lesson.video_url)+'" target="_blank" rel="noopener">Assistir</a>' : '';
      return '<div class="lesson"><span>'+esc(lesson.title)+'</span>'+link+'</div>';
    }).join('');
    return '<div class="module"><strong>'+esc(module.title)+'</strong>'+lessonsHtml+'</div>';
  }).join('');
  return '<article class="card">'+(course.cover_url?'<img src="'+esc(course.cover_url)+'" alt="" style="width:100%;height:150px;object-fit:cover;border-radius:10px">':'')+'<h2>'+esc(course.title)+'</h2><p>'+esc(course.description)+'</p>'+(moduleHtml||'<p>Conteúdos em preparação.</p>')+'</article>';
}
async function load(){
  const auth=await db.auth.getSession();
  if(!auth.data.session){location.href='/area-do-aluno/login.html';return}
  const result=await db.from('courses').select('id,title,description,cover_url,course_modules(id,title,position,course_lessons(id,title,position,video_url,published))').order('created_at',{ascending:false});
  if(result.error){status.textContent='A área de conteúdos ainda está sendo configurada. Em breve seus cursos aparecerão aqui.';return}
  const rows=result.data||[];
  status.textContent=rows.length?'Selecione uma aula para começar.':'Nenhum curso foi liberado para sua matrícula ainda.';
  courses.innerHTML=rows.map(renderCourse).join('');
}
document.getElementById('logout').onclick=async()=>{await db.auth.signOut();location.href='/area-do-aluno/login.html'};
load();
</script>
</body>
</html>
